name: CI

on: [push, pull_request]

jobs:
  quality:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: jotacomplaint_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set up environment variables
        run: |
          echo "DATABASE_URL=postgresql://user:password@localhost:5432/jotacomplaint_test" >> .env
          echo "AUTH_SECRET=ci-secret-key-for-testing-only-32chars" >> .env
          echo "AUTH_URL=http://localhost:3000" >> .env
          echo "AUTH_TRUST_HOST=true" >> .env
          echo "UPSTASH_REDIS_REST_URL=https://fake-ci.upstash.io" >> .env
          echo "UPSTASH_REDIS_REST_TOKEN=ci-fake-token" >> .env
          echo "QSTASH_TOKEN=ci-fake-qstash-token" >> .env
          echo "QSTASH_CURRENT_SIGNING_KEY=ci-fake-signing-key" >> .env
          echo "QSTASH_NEXT_SIGNING_KEY=ci-fake-next-signing-key" >> .env
          echo "NEXT_PUBLIC_APP_URL=http://localhost:3000" >> .env
          echo "RESEND_API_KEY=re_ci_fake_key" >> .env
          echo "AWS_REGION=us-east-1" >> .env
          echo "AWS_ACCESS_KEY_ID=ci-fake-access-key" >> .env
          echo "AWS_SECRET_ACCESS_KEY=ci-fake-secret-key" >> .env
          echo "S3_UPLOAD_BUCKET=jotacomplaint-ci-fake" >> .env
          echo "SKIP_ENV_VALIDATION=1" >> .env

      - name: Enable pg_trgm extension
        run: psql postgresql://user:password@localhost:5432/jotacomplaint_test -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"

      - name: Prisma Generate & Push
        run: |
          npx prisma generate
          npx prisma db push


      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npm run typecheck

      - name: Run Unit Tests (Vitest)
        run: npm run test -- --run

      - name: Seed database for E2E
        run: npm run seed

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E Tests (Playwright)
        run: npm run test:e2e
        env:
          CI: true
          SKIP_ENV_VALIDATION: 1

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
